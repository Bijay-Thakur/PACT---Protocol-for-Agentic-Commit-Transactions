name: pact-reference-boundary

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: ${PACT_REFERENCE_DB_PASSWORD:?private disposable DB password required}
      POSTGRES_DB: pact
    networks: [protected]
    volumes:
      - reference_pgdata:/var/lib/postgresql/data
      - ../../docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-pact-sim.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 3s
      timeout: 3s
      retries: 20

  simulators:
    build: ../../backend
    command: ["uvicorn", "app.simulators.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      PACT_SIM_STANDALONE: "1"
      PACT_SIM_DATABASE_URL: postgresql+asyncpg://pact:${PACT_REFERENCE_DB_PASSWORD}@postgres:5432/pact_sim
    depends_on:
      postgres: { condition: service_healthy }
    networks: [protected]

  pact:
    build: ../../backend
    environment:
      PACT_DATABASE_URL: postgresql+asyncpg://pact:${PACT_REFERENCE_DB_PASSWORD}@postgres:5432/pact
      PACT_SIM_BASE_URL: http://simulators:8100
      PACT_MODEL_PROFILE: ${PACT_MODEL_PROFILE:-deterministic_fixture}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      PACT_CODE_SANDBOX_REPO: /srv/target/sandbox.git
      PACT_CODE_SANDBOX_REPO_ID: council_fixture
      PACT_CODE_SANDBOX_ALLOWED_PATHS: approved.txt,docs/note.txt
      PACT_DEMO_MODE: "false"
      PACT_EMBEDDED_WORKER: "true"
    volumes:
      - type: bind
        source: ../../.local/reference/sandbox.git
        target: /srv/target/sandbox.git
    depends_on:
      postgres: { condition: service_healthy }
      simulators: { condition: service_started }
    networks: [protected, agent, publish]
    ports: ["127.0.0.1:18080:8000"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    profiles: [probe]
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      PACT_API_URL: http://pact:8000
      PACT_AGENT_API_KEY: ${PACT_AGENT_API_KEY:-}
    depends_on:
      pact: { condition: service_healthy }
    networks: [agent]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64

networks:
  protected:
    internal: true
  agent:
    internal: true
  publish:

volumes:
  reference_pgdata:
